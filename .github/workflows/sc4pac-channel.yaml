name: sc4pac-channel
description: |-
  Reusable workflow of common actions for building an sc4pac metadata channel.
  Supported workflow triggers: 'push' and 'pull_request'.

on:
  workflow_call:
    inputs:
      path:
        description: Path to yaml sources directory (e.g. "src" or "src/yaml"), without unnecessary leading or trailing `/` characters.
        required: true
        type: string
      channel-label:
        description: Unique short descriptive name for the channel, passed as label to the channel-build command.
        required: true
        type: string
      deploy-repository:
        description: The repository for deployment (to prevent deployment in forks) in the form 'OWNER/REPO'
        required: true
        type: string
      channel-artifact-name:
        description: Optionally, a custom name for the intermediate channel artifact.
        required: false
        type: string
        default: channel-artifact.zip
      skip-build-website:
        description: Whether to skip building the main channel website (HTML files, etc.).
        required: false
        type: boolean
        default: true
      sc4pac-tools-submodule:
        description: >-
          Required only if `skip-build-website` is set to false.
          This is the relative path to a pinned sc4pac-tools submodule, which is used to build the website.
        required: false
        type: string
        default: ''
      skip-test:
        description: Optionally skip the test job.
        required: false
        type: boolean
        default: false
      skip-url-check:
        description: Whether to skip the url-check job, as it requires a custom `STEX_API_KEY`.
        required: false
        type: boolean
        default: true
      skip-deploy:
        description: >-
          Whether to skip the final deploy job of the channel.
          This is useful when the built channel files from the artifact `outputs.channel-artifact-name` are processed further outside of this workflow.
        required: false
        type: boolean
        default: false
    outputs:
      channel-artifact-name:
        description: Name of the artifact containing the built channel files. Same as corresponding input if given.
        value: ${{ jobs.build-channel.outputs.channel-artifact-name }}
      website-artifact-name:
        description: Name of the artifact containing the built website HTML files. Only present if `skip-build-website` is false.
        value: ${{ jobs.build-website.outputs.website-artifact-name }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          ${{ inputs.path }}
    - name: Install sc4pac-lint
      uses: memo33/sc4pac-actions/actions/setup-lint@main
    - name: Lint
      run: sc4pac-lint "$SRC_YAML"
      env:
        SRC_YAML: ${{ inputs.path }}

  build-channel:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      channel-artifact-name: ${{ inputs.channel-artifact-name }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          ${{ inputs.path }}
    - name: Build channel
      uses: memo33/sc4pac-actions/actions/build@privileges
      with:
        path: ${{ inputs.path }}
        output-path: ${{ runner.temp }}/tmp_channel
        channel-label: ${{ inputs.channel-label }}
        metadata-source-url: ${{ format('https://github.com/{0}/blob/{1}/{2}/', github.repository, github.event.repository.default_branch, inputs.path) }}
    - name: Upload channel artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.channel-artifact-name }}
        path: ${{ runner.temp }}/tmp_channel
        if-no-files-found: error
        retention-days: 7

      # TODO If any of the following steps fails in the wild, consider moving them
      # to a separate `pre-test` job to guarantee success of the `build-channel` job needed for `deploy`.
    - name: Checkout and identify changes
      if: ${{ !inputs.skip-test || !inputs.skip-url-check }}
      id: identify-changes
      uses: memo33/sc4pac-actions/actions/checkout-and-identify-changes@privileges
      with:
        path: ${{ inputs.path }}
        destination: tmp_repo_diff
    - name: Upload list of modified packages as artifact
      if: ${{ !inputs.skip-test }}
      uses: actions/upload-artifact@v7
      with:
        name: modified-packages-artifact
        path: ${{ steps.identify-changes.outputs.modified-packages-list }}
        if-no-files-found: error
        retention-days: 7
    - name: Create pending check for test job
      if: ${{ !inputs.skip-test }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const res = await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: "test",
            head_sha: "${{ github.event.pull_request.head.sha || github.sha }}",
            status: "in_progress",
            output: {
              title: "Test",
              summary: "Waiting for test results..."
            }
          });

    - name: Isolate the modified yaml files to prepare upload
      if: ${{ !inputs.skip-url-check }}
      env:
        MODIFIED_YAML_LIST: ${{ steps.identify-changes.outputs.modified-files-list }}
      run: |
        tar -czf "$RUNNER_TEMP/modified-yaml-files.tar.gz" --files-from="$MODIFIED_YAML_LIST"
    - name: Upload modified yaml files as artifact
      if: ${{ !inputs.skip-url-check }}
      uses: actions/upload-artifact@v7
      with:
        name: modified-yaml-files.tar.gz
        path: ${{ runner.temp }}/modified-yaml-files.tar.gz
        if-no-files-found: error
        retention-days: 7
        archive: false
    - name: Create pending check for url-check job
      if: ${{ !inputs.skip-url-check }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const res = await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: "url-check",
            head_sha: "${{ github.event.pull_request.head.sha || github.sha }}",
            status: "in_progress",
            output: {
              title: "URL Check",
              summary: "Waiting for url-check results..."
            }
          });

  build-website:
    needs: lint
    if: |
      !inputs.skip-build-website && inputs.sc4pac-tools-submodule != ''
      && github.repository == inputs.deploy-repository
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event_name != 'pull_request_target' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      website-artifact-name: website-artifact.zip
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive
    - name: Build website
      uses: memo33/sc4pac-actions/actions/build-website@privileges
      with:
        sc4pac-tools-submodule: ${{ inputs.sc4pac-tools-submodule }}
        pages-output-path: ${{ runner.temp }}/tmp_gh-pages
    - name: Upload website artifact
      uses: actions/upload-artifact@v7
      with:
        name: website-artifact.zip
        path: ${{ runner.temp }}/tmp_gh-pages
        if-no-files-found: error
        retention-days: 7

  deploy:
    needs: [ build-channel, build-website ]
    if: |
      always()
      && !inputs.skip-deploy
      && (needs.build-channel.result == 'success')
      && (needs.build-website.result == 'success' || needs.build-website.result == 'skipped')
      && github.repository == inputs.deploy-repository
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event_name != 'pull_request_target' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Download website artifact
      if: ${{ needs.build-website.result != 'skipped' }}
      uses: actions/download-artifact@v8
      with:
        name: website-artifact.zip
        path: ${{ runner.temp }}/gh-pages
    - name: Download channel artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.channel-artifact-name }}
        path: ${{ runner.temp }}/gh-pages/channel
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Upload artifact
      # note that this action dereferences our `latest` symlinks, but that's not a huge problem, it just duplicates each json file (could maybe be avoided by using tar)
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ runner.temp }}/gh-pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
