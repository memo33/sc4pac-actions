name: test-install
description: >-
  Attempts to install the selected packages using `sc4pac test`.

inputs:
  channel-path:
    description: Absolute path to folder containing built channel json files
    required: true
  packages-list:
    description: A file containing the names of packages to test (newline-separated).
    required: true
  sc4pac-simtropolis-token:
    description: Secret token for downloading STEX files.
    required: false
  max-packages:
    description: Maximum number of packages to attempt to download and install.
    required: false
    default: '200'
  sc4pac-cache:
    description: Alternative absolute location of the sc4pac cache to re-use an existing cache.
    required: false
    default: ${{ runner.temp }}/sc4pac-cache
outputs: {}

runs:
  using: composite
  steps:
    - name: Initialize sc4pac to use local channel
      # creates "sc4pac-plugins.json"
      shell: bash
      env:
        CACHE_ROOT: ${{ inputs.sc4pac-cache }}
        CHANNEL_PATH: ${{ inputs.channel-path }}
      run: |
        cat >sc4pac-plugins.json <<EOL
        {
          "config": {
            "pluginsRoot": "tmp_build/plugins",
            "cacheRoot": "${CACHE_ROOT}",
            "tempRoot": "tmp_build/temp",
            "variant": {},
            "channels": [
              "file://${CHANNEL_PATH%/}/"
            ]
          },
          "explicit": []
        }
        EOL

    - name: Check preconditions for test
      shell: bash
      env:
        MAX_PKGS: ${{ inputs.max-packages }}
        PKGS_LIST: ${{ inputs.packages-list }}
      run: |
        if [[ $(wc -l < "$PKGS_LIST") -gt "$MAX_PKGS" ]]; then echo "::error::Too many packages." ; false; fi
        if [[ $(wc -l < "$PKGS_LIST") -eq 0 ]]; then echo "::error::Found no packages to test." ; false; fi

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Install sc4pac
      uses: memo33/sc4pac-actions/actions/setup-sc4pac@privileges

    - name: Identify assets to download
      shell: bash
      id: get-assets-list
      env:
        PKGS_LIST: ${{ inputs.packages-list }}
      run: |
        assets_list="$(cat "$PKGS_LIST" \
          | xargs --delimiter '\n' sc4pac test --yes --list-assets -- \
          | { grep '^\S' || true; } )"
        echo "$assets_list"
        echo "cache_key=$(echo "$assets_list" | cut -d ' ' -f 2- | sort | sha256sum | head -c 12)" >> $GITHUB_OUTPUT

      # The above cache_key is derived from `version` and `url` only, ignoring `assetId`.
      # Hence, changing an assetId does not invalidate the cache, but changing an asset version or URL triggers a redownload.
    - name: Restore the download cache
      id: restore-cache
      uses: actions/cache/restore@v6
      with:
        key: sc4pac-download-cache-${{ steps.get-assets-list.outputs.cache_key }}
        path: ${{ inputs.sc4pac-cache }}

    - name: Download assets
      if: steps.restore-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SC4PAC_SIMTROPOLIS_TOKEN: ${{ inputs.sc4pac-simtropolis-token }}
        # enforce ANSI colors with GH actions:
        SC4PAC_JAVA_OPTIONS: '-Djansi.mode=force -XX:+IgnoreUnrecognizedVMOptions --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED'
        PKGS_LIST: ${{ inputs.packages-list }}
      run: |
        cat "$PKGS_LIST" \
          | xargs --delimiter '\n' sc4pac test --yes --download-only --

    - name: Save the download cache
      if: steps.restore-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-cache.outputs.cache-primary-key }}
        path: ${{ inputs.sc4pac-cache }}

    - name: Test installing modified packages
      shell: bash
      env:
        SC4PAC_SIMTROPOLIS_TOKEN: ${{ inputs.sc4pac-simtropolis-token }}
        # enforce ANSI colors with GH actions:
        SC4PAC_JAVA_OPTIONS: '-Djansi.mode=force -XX:+IgnoreUnrecognizedVMOptions --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED'
        PKGS_LIST: ${{ inputs.packages-list }}
      run: |
        cat "$PKGS_LIST" \
          | xargs --delimiter '\n' sc4pac test --yes --output "tmp_build/plugins" --

    - name: List installed files
      shell: bash
      run: |
        tree -C "tmp_build/plugins"
