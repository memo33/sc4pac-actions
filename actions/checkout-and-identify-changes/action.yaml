name: checkout-and-identify-changes
description: >-
  Compares two commits to find modified yaml files.
  The resulting list of modified/added files is written to the file `outputs.files-list`.

inputs:
  path:
    description: Source folder containing yaml files to analyze
    required: true
  destination:
    description: Relative destination folder to which the files of the newer commit are checked out.
    required: true
outputs:
  modified-files-list:
    description: A file containing the names of modified yaml files (newline-separated).
    value: ${{ format('{0}/modified-yaml-files.txt', runner.temp) }}
  modified-packages-list:
    description: A file containing the names of modified packages (newline-separated).
    value: ${{ format('{0}/modified-packages.txt', runner.temp) }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # to allow diff of other commit
        persist-credentials: false
        path: ${{ inputs.destination }}
        sparse-checkout: |
          ${{ inputs.path }}
    - name: Identify modified YAML files (pull_request)
      if: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        SRC_YAML: ${{ inputs.path }}
        DEST: ${{ inputs.destination }}
      # We checked out PR merge-commit into `DEST`.
      run: |
        cd "$DEST"
        git diff --diff-filter=d --name-only @^ -- "$SRC_YAML" > "$RUNNER_TEMP/modified-yaml-files.txt"
    - name: Identify modified YAML files (push)
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      env:
        SRC_YAML: ${{ inputs.path }}
        PREVIOUS_COMMIT: ${{ github.event.before }}
        DEST: ${{ inputs.destination }}
      # TODO This is not perfect yet, as `before` does not exist on new branches or forced pushes.
      # Consider comparing to merge-base with default branch as fallback.
      run: |
        cd "$DEST"
        git diff --diff-filter=d --name-only "$PREVIOUS_COMMIT" -- "$SRC_YAML" > "$RUNNER_TEMP/modified-yaml-files.txt"
    - name: List modified YAML files
      shell: bash
      run: |
        cat "$RUNNER_TEMP/modified-yaml-files.txt"
        echo "Found $(wc -l < "$RUNNER_TEMP/modified-yaml-files.txt") modified YAML files."

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      shell: bash
      run: python -m pip install --upgrade PyYAML jsonschema python-dateutil
    - name: Identify modified packages
      shell: bash
      env:
        DEST: ${{ inputs.destination }}
      run: |
        cd "$DEST"
        cat "$RUNNER_TEMP/modified-yaml-files.txt" \
          | xargs --delimiter '\n' python "$GITHUB_ACTION_PATH/../../src/list-packages.py" > "$RUNNER_TEMP/modified-packages.txt"
        cat "$RUNNER_TEMP/modified-packages.txt"
        echo "Found $(wc -l < "$RUNNER_TEMP/modified-packages.txt") modified packages."
