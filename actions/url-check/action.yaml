name: url-check
description: >-
  Checks whether asset URLs in modified yaml files are up-to-date using the STEX API (which requires API key).

inputs:
  path:
    description: Source folder containing only relevant yaml files to analyze
    required: true
  stex-api-key:
    description: Required secret token for accessing the STEX API.
    required: true
outputs: {}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      shell: bash
      run: python -m pip install --upgrade PyYAML jsonschema python-dateutil
    - name: Check STEX URLs
      shell: bash
      env:
        STEX_API_KEY: ${{ inputs.stex-api-key }}
        YAML_PATH: ${{ inputs.path }}
      run: |
        echo $(printf '%.s─' $(seq 1 80))  # horizontal line
        python "$GITHUB_ACTION_PATH/../../src/check-updates.py" --api=stex --mode=id -- "$YAML_PATH"
