name: build
description: Build an sc4pac metadata channel (converting YAML to JSON files)

inputs:
  path:
    description: Relative path to source folder containing yaml input files (e.g. `src/yaml`)
    required: true
  output-path:
    description: |-
      Path to output folder containing generated channel json files (deprecation note: not nested in a "channel" subfolder anymore).
    required: true
  channel-label:
    description: Short name for the channel, passed as label to the channel-build command.
    required: true
  metadata-source-url:
    description: URL base path for yaml files, passed to the channel-build command.
    required: true

runs:
  using: composite
  steps:
  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: 'temurin'

  - name: Install sc4pac
    uses: memo33/sc4pac-actions/actions/setup@privileges

  - name: Build channel
    shell: bash
    run: sc4pac channel build --label "$LABEL" --metadata-source-url "$METADATA_SOURCE_URL" --output "$OUTPUT_PATH" "$SRC_YAML"
    env:
      SRC_YAML: ${{ inputs.path }}
      OUTPUT_PATH: ${{ inputs.output-path }}
      LABEL: ${{ inputs.channel-label }}
      METADATA_SOURCE_URL: ${{ inputs.metadata-source-url }}
